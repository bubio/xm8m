def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY')
def buildAsApplication = !buildAsLibrary
def retroAchievementsEnabled = !project.hasProperty('XM8_ENABLE_RETROACHIEVEMENTS') ||
        (!project.property('XM8_ENABLE_RETROACHIEVEMENTS').toString().equalsIgnoreCase('false') &&
        project.property('XM8_ENABLE_RETROACHIEVEMENTS').toString() != '0')
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    namespace = "net.retropc.pi"
    ndkVersion = "23.2.8568313"
    compileSdk = 36

    defaultConfig {
        if (buildAsApplication) {
            applicationId = "net.retropc.pi"
        }
        // One APK supports API 19+. RetroAchievements is enabled at runtime
        // only on API 23+, where Android Keystore AES-GCM is available.
        minSdk = 19
        targetSdk = 36
        versionCode = 200
        versionName = "2.00"
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-19"
                if (retroAchievementsEnabled) {
                    arguments "XM8_ENABLE_RETROACHIEVEMENTS=1"
                }
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            storeFile = rootProject.file('release.keystore')
            storePassword = System.getenv('KEYSTORE_PASSWORD')
            keyAlias = System.getenv('KEY_ALIAS')
            keyPassword = System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (rootProject.file('release.keystore').exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    lint {
        abortOnError = true
    }

    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            ndkBuild {
                path 'jni/Android.mk'
            }
        }
    }
}

def generatedLegalAssets = layout.buildDirectory.dir('generated/xm8LegalAssets')
def copyLegalAssets = tasks.register('copyLegalAssets', Copy) {
    into generatedLegalAssets
    from(rootProject.file('../../PRIVACY.md'))
    from(rootProject.file('../../PRIVACY.ja.md'))
    from(rootProject.file('../../LICENSES.md'))
    from(rootProject.file('../../ThirdParty/THIRD_PARTY_NOTICES.md'))
    into('Licenses') {
        from(rootProject.file('../../ThirdParty/licenses'))
    }
}
android.sourceSets.main.assets.srcDir(generatedLegalAssets.get().asFile)
tasks.named('preBuild').configure { dependsOn(copyLegalAssets) }

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    testImplementation 'junit:junit:4.13.2'
}

// Android.mk compiles sources outside Builder/Android. Register them as task
// inputs so Android Studio does not reuse an old native library after a C++
// source edit.
def xm8SourceDirectory = rootProject.file('../../Source')
tasks.configureEach {
    if (name.startsWith('configureNdkBuild') || name.startsWith('buildNdkBuild')) {
        inputs.dir(xm8SourceDirectory)
    }
}

if (buildAsLibrary) {
    def copyDebugAar = tasks.register('copyDebugAar', Copy) {
        dependsOn 'bundleDebugAar'
        from layout.buildDirectory.file('outputs/aar/app-debug.aar')
        into layout.buildDirectory.dir('outputs/aar')
        rename { 'net.retropc.pi.aar' }
    }
    tasks.matching { it.name == 'assembleDebug' }.configureEach {
        finalizedBy copyDebugAar
    }
}
