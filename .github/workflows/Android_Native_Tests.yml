name: Android Native Tests

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - '*.md'
      - 'Documents/**'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'Documents/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Native C++ (Android 29, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;23.2.8568313'
      - name: Set up application SDL2 sources
        working-directory: Builder/Android
        run: ./setup_sdl2.sh
      - name: Build native unit tests
        run: |
          "$ANDROID_HOME/ndk/23.2.8568313/ndk-build" NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Tests/Android/Android.mk \
            NDK_APPLICATION_MK=Tests/Android/Application.mk \
            NDK_OUT="$GITHUB_WORKSPACE/build-android-tests/obj" \
            NDK_LIBS_OUT="$GITHUB_WORKSPACE/build-android-tests/libs" -j3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native tests in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: python3 scripts/run_android_native_tests.py build-android-tests/libs/x86_64 --serial emulator-5554 --report build-android-tests/results.xml
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-native-api29-x86_64
          path: build-android-tests/results.xml
          if-no-files-found: warn
