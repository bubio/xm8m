name: Android Build

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - '*.md'
      - 'Documents/**'
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '*.md'
      - 'Documents/**'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install NDK 23.2.8568313
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;23.2.8568313"
          
      - name: Cache SDL2
        id: cache-sdl2
        uses: actions/cache@v6
        with:
          path: |
            Builder/Android/app/jni/SDL
            Builder/Android/app/src/main/java/org/libsdl
          key: ${{ runner.os }}-android-sdl2-${{ hashFiles('Builder/Android/setup_sdl2.sh', 'Builder/Android/patches/sdl2-2.32.10-android-compat.patch') }}
          restore-keys: |
            ${{ runner.os }}-android-sdl2-

      - name: Setup SDL2
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        working-directory: Builder/Android
        run: ./setup_sdl2.sh

      - name: Run Java unit tests
        working-directory: Builder/Android
        run: ./gradlew :app:testDebugUnitTest -PEXCLUDE_NATIVE_LIBS --tests net.retropc.pi.RaHttpHeadersTest

      - name: Upload Java test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-tests
          path: |
            Builder/Android/app/build/reports/tests/testDebugUnitTest/
            Builder/Android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - name: Build with Gradle
        working-directory: Builder/Android
        run: |
          if [[ -n "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            export KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
            export KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
            export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
          fi
          ./gradlew assembleRelease

      - name: Rename APK to XM8_Android.apk
        run: |
          apks=(Builder/Android/app/build/outputs/apk/release/*.apk)
          mv "${apks[0]}" Builder/Android/app/build/outputs/apk/release/XM8_Android.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: XM8_Android.apk
          path: Builder/Android/app/build/outputs/apk/release/XM8_Android.apk

      - name: Update Release
        if: ${{ github.event_name == 'release' && !env.ACT }}
        uses: svenstaro/upload-release-action@v2
        with:
          file: Builder/Android/app/build/outputs/apk/release/XM8_Android.apk
          overwrite: true
