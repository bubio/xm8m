name: Windows x86/x64/ARM64 Build

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - '*.md'
      - 'Documents/**'
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '*.md'
      - 'Documents/**'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # SDL2 のセットアップをキャッシュし、必要ならスクリプトで実行
      - name: Cache SDL2
        id: cache-sdl2
        uses: actions/cache@v6
        with:
          path: Builder/Windows/SDL2
          key: ${{ runner.os }}-sdl2-${{ hashFiles('Builder/Windows/setup_sdl2.ps1') }}
          restore-keys: |
            ${{ runner.os }}-sdl2-

      - name: Setup SDL2
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: Builder/Windows
        run: .\setup_sdl2.ps1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      # x64 ビルド
      - name: Build XM8 (x64)
        run: msbuild Builder/Windows/XM8.sln /p:Configuration=Release /p:Platform=x64 /p:XM8_ENABLE_RETROACHIEVEMENTS=true

      - name: Test screenshot storage (x64)
        shell: pwsh
        run: |
          $repo = (Get-Location).Path
          $testDir = Join-Path $env:RUNNER_TEMP 'xm8-screenshot-test'
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null
          $compilerArgs = @(
            '/nologo', '/std:c++17', '/EHsc', '/utf-8', '/MD',
            "/I$repo\Source\UI", "/I$repo\Builder\Windows\SDL\include",
            "$repo\Tests\screenshot_test.cpp", "$repo\Source\UI\screenshot.cpp",
            "$repo\Source\UI\platform_path.cpp",
            '/Fe:screenshot_test.exe', '/link', '/SUBSYSTEM:CONSOLE',
            "/LIBPATH:$repo\Builder\Windows\SDL\lib\x64",
            'SDL2.lib', 'shell32.lib', 'ole32.lib', 'uuid.lib', 'user32.lib'
          )
          Push-Location $testDir
          try {
            & cl @compilerArgs
            if ($LASTEXITCODE -ne 0) { throw 'Screenshot test compilation failed' }
            Copy-Item "$repo\Builder\Windows\SDL\lib\x64\SDL2.dll" .
            & .\screenshot_test.exe (Join-Path $testDir 'output')
            if ($LASTEXITCODE -ne 0) { throw 'Screenshot storage regression failed' }
          } finally {
            Pop-Location
          }

      # Win32 ビルド
      - name: Build XM8 (Win32)
        run: msbuild Builder/Windows/XM8.sln /p:Configuration=Release /p:Platform=Win32 /p:XM8_ENABLE_RETROACHIEVEMENTS=true

      # ARM64 ビルド
      - name: Build XM8 (ARM64)
        run: msbuild Builder/Windows/XM8.sln /p:Configuration=Release /p:Platform=ARM64 /p:XM8_ENABLE_RETROACHIEVEMENTS=true

      - name: Collect Artifacts
        run: |
          New-Item -ItemType Directory -Path artifacts_x64 -Force | Out-Null
          Copy-Item Builder/Windows/x64/Release/XM8.exe artifacts_x64/ -Force
          Copy-Item Builder/Windows/x64/Release/SDL2.dll artifacts_x64/ -Force
          Copy-Item Builder/Windows/x64/Release/THIRD_PARTY_NOTICES.md artifacts_x64/ -Force
          Copy-Item Builder/Windows/x64/Release/PRIVACY.md artifacts_x64/ -Force
          Copy-Item Builder/Windows/x64/Release/PRIVACY.ja.md artifacts_x64/ -Force
          Copy-Item Builder/Windows/x64/Release/LICENSES.md artifacts_x64/ -Force
          Copy-Item Builder/Windows/x64/Release/Licenses artifacts_x64/ -Recurse -Force
          New-Item -ItemType Directory -Path artifacts_Win32 -Force | Out-Null
          Copy-Item Builder/Windows/Win32/Release/XM8.exe artifacts_Win32/ -Force
          Copy-Item Builder/Windows/Win32/Release/SDL2.dll artifacts_Win32/ -Force
          Copy-Item Builder/Windows/Win32/Release/THIRD_PARTY_NOTICES.md artifacts_Win32/ -Force
          Copy-Item Builder/Windows/Win32/Release/PRIVACY.md artifacts_Win32/ -Force
          Copy-Item Builder/Windows/Win32/Release/PRIVACY.ja.md artifacts_Win32/ -Force
          Copy-Item Builder/Windows/Win32/Release/LICENSES.md artifacts_Win32/ -Force
          Copy-Item Builder/Windows/Win32/Release/Licenses artifacts_Win32/ -Recurse -Force
          New-Item -ItemType Directory -Path artifacts_ARM64 -Force | Out-Null
          Copy-Item Builder/Windows/ARM64/Release/XM8.exe artifacts_ARM64/ -Force
          Copy-Item Builder/Windows/ARM64/Release/SDL2.dll artifacts_ARM64/ -Force
          Copy-Item Builder/Windows/ARM64/Release/THIRD_PARTY_NOTICES.md artifacts_ARM64/ -Force
          Copy-Item Builder/Windows/ARM64/Release/PRIVACY.md artifacts_ARM64/ -Force
          Copy-Item Builder/Windows/ARM64/Release/PRIVACY.ja.md artifacts_ARM64/ -Force
          Copy-Item Builder/Windows/ARM64/Release/LICENSES.md artifacts_ARM64/ -Force
          Copy-Item Builder/Windows/ARM64/Release/Licenses artifacts_ARM64/ -Recurse -Force

      - name: Upload Artifacts (XM8_Windows_x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: XM8_Windows_x86_64
          path: artifacts_x64/

      - name: Upload Artifacts (XM8_Windows_x86_32)
        uses: actions/upload-artifact@v7
        with:
          name: XM8_Windows_x86_32
          path: artifacts_Win32/

      - name: Upload Artifacts (XM8_Windows_ARM64)
        uses: actions/upload-artifact@v7
        with:
          name: XM8_Windows_ARM64
          path: artifacts_ARM64/

      - name: Package Windows Artifacts
        if: ${{ github.event_name == 'release' && !env.ACT }}
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts_x64/* -DestinationPath XM8_Windows_x86_64.zip -Force
          Compress-Archive -Path artifacts_Win32/* -DestinationPath XM8_Windows_x86_32.zip -Force
          Compress-Archive -Path artifacts_ARM64/* -DestinationPath XM8_Windows_ARM64.zip -Force

      - name: Update Release x86_64
        if: ${{ github.event_name == 'release' && !env.ACT }}
        uses: svenstaro/upload-release-action@v2
        with:
          file: XM8_Windows_x86_64.zip
          overwrite: true

      - name: Update Release x86_32
        if: ${{ github.event_name == 'release' && !env.ACT }}
        uses: svenstaro/upload-release-action@v2
        with:
          file: XM8_Windows_x86_32.zip
          overwrite: true

      - name: Update Release ARM64
        if: ${{ github.event_name == 'release' && !env.ACT }}
        uses: svenstaro/upload-release-action@v2
        with:
          file: XM8_Windows_ARM64.zip
          overwrite: true
